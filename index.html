<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose Day Proposal for Ashwini 🌹</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500;600&display=swap"
        rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Falling Roses */
        .rose {
            position: absolute;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* Glassmorphism Card */
        .container {
            padding: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            width: 100%;
            max-width: 450px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5em;
            /* Increased size */
            background: linear-gradient(45deg, #ff0055, #ff0000);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .name   {
            font-size: 1.8em;
            font-weight: 600;
            color: #d6336c;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Photo with better frame */
        .photo-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        .photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .photo:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .bigrose {
            font-size: 60px;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 5px 15px rgba(230, 0, 51, 0.3));
            margin: 10px 0;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .msg {
            font-size: 1.1em;
            line-height: 1.7;
            color: #4a4a4a;
            /* Darker for better contrast */
            margin: 15px 0 25px;
            font-weight: 500;
        }

        .question {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5em;
            color: #c00;
            margin-bottom: 30px;
        }

        /* Improved Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
            /* Space for buttons */
        }

        button {
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            outline: none;
        }

        .yes {
            background: linear-gradient(45deg, #ff4d6d, #ff0055);
            color: white;
        }

        .yes:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 0, 85, 0.4);
        }

        .no {
            background: #f1f3f5;
            color: #495057;
            position: absolute;
            /* Needed for movement */
        }

        /* Result Message */
        #result {
            display: none;
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: 700;
            color: #d6336c;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            border: none;
            font-size: 20px;
        }

        /* Mobile tweaks */
        @media (max-width: 400px) {
            h1 {
                font-size: 2.8em;
            }

            .card {
                padding: 30px 20px;
            }

            .photo-container {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Music -->
    <audio id="bgm" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button class="music-control" onclick="toggleMusic()">🎵</button>

    <div class="container">
        <div class="card">

            <h1>Happy Rose Day</h1>
            <div class="name">Ashwini 🌹</div>

            <div class="photo-container">
                <img src="image.png" class="photo" alt="Ashwini">
            </div>

            <div class="bigrose">🌹</div>

            <div class="msg">
                This rose is for you… <br>
                Every petal carries my feelings. <br>
                Today I want to ask something straight from my heart ❤️
            </div>

            <div class="question">
                Will you be mine?
            </div>

            <div class="buttons" id="btnArea">
                <button class="yes" onclick="sayYes()">Yes 💖</button>
                <button class="no" id="noBtn">No 😄</button>
            </div>

            <div id="result">You just made my Rose Day perfect! 🌹❤️<br>I Love You!</div>

        </div>
    </div>

    <script>
        /* Music Control */
        const bgm = document.getElementById("bgm");
        let isMusicPlaying = false;

        function toggleMusic() {
            if (isMusicPlaying) {
                bgm.pause();
                isMusicPlaying = false;
            } else {
                bgm.play().then(() => {
                    isMusicPlaying = true;
                }).catch(e => console.log("Audio play failed", e));
            }
        }

        // Auto-play attempt on interaction
        document.body.addEventListener('click', () => {
            if (!isMusicPlaying) toggleMusic();
        }, { once: true });


        /* Improved Falling Roses */
        function createRose() {
            const rose = document.createElement("div");
            rose.className = "rose";
            rose.innerHTML = Math.random() > 0.5 ? "🌹" : "🌸"; // Mix it up

            // Random position and size
            rose.style.left = Math.random() * 100 + "vw";
            rose.style.fontSize = (Math.random() * 20 + 15) + "px";
            rose.style.opacity = Math.random() * 0.5 + 0.5;

            // Random animation speed
            const duration = Math.random() * 5 + 5;
            rose.style.animationDuration = duration + "s";

            document.body.appendChild(rose);

            // Cleanup
            setTimeout(() => rose.remove(), duration * 1000);
        }

        setInterval(createRose, 400);


        /* The Uncatchable NO Button */
        const noBtn = document.getElementById("noBtn");
        const btnArea = document.getElementById("btnArea");

        const noTexts = ["No 😄", "Are you sure?", "Really?", "Think again!", "Last chance!", "You can't catch me!"];
        let textIndex = 0;

        function moveButton() {
            // Determine bounds
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            let newX = Math.random() * maxX;
            let newY = Math.random() * maxY;

            // Move to body to escape the card's transform context (if not already there)
            if (noBtn.parentNode !== document.body) {
                // Calculate current position to avoid jump (optional, but let's just move it)
                document.body.appendChild(noBtn);
                noBtn.style.position = "fixed";
                noBtn.style.zIndex = "1000"; // Ensure it's on top
            }

            noBtn.style.left = Math.max(10, newX) + "px";
            noBtn.style.top = Math.max(10, newY) + "px";

            // Change text
            textIndex = (textIndex + 1) % noTexts.length;
            noBtn.innerText = noTexts[textIndex];
        }

        noBtn.addEventListener("mouseover", moveButton);
        noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveButton(); }); // Mobile support


        /* The YES Celebration */
        function sayYes() {
            // Hide buttons
            document.getElementById("btnArea").style.display = "none";
            document.querySelector(".question").style.display = "none";

            // Show result
            const result = document.getElementById("result");
            result.style.display = "block";

            // Confetti Explosion
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function () {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                // since particles fall down, start a bit higher than random
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // Continuous heart rain
            setInterval(() => {
                confetti({
                    particleCount: 5,
                    angle: 90,
                    spread: 45,
                    origin: { x: 0.5, y: -0.1 },
                    shapes: ['circle'],
                    colors: ['#ff0000', '#ffccd5']
                });
            }, 500);
        }
    </script>

</body>

</html>
